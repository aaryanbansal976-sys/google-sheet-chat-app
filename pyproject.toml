[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "support-insights"
version = "0.1.0"
description = "Google Sheets support-message analysis and dashboard"
requires-python = ">=3.12"
dependencies = [
    "streamlit>=1.40,<2",
    "gspread>=6.1,<7",
    "google-auth>=2.35,<3",
    "litellm>=1.74,<2",
    "openai>=2,<3",
    "pydantic>=2.9,<3",
    "pandas>=2.2,<3",
    "tenacity>=9,<10",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]